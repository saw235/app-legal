<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OAuth Redirect</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#222}code{display:block;background:#f4f4f4;border:1px solid #ddd;padding:1rem;word-break:break-all;font-size:1rem;margin:1rem 0}</style></head>
<body>
<h1>OAuth redirect landing</h1>
<div id="out">No authorization code in the URL.</div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get("code"); const err = p.get("error");
const out = document.getElementById("out");
if (code) { out.innerHTML = "<p>Authorization <b>code</b> (copy this):</p><code>" + code.replace(/[<>&]/g, "") + "</code><p>Paste it into the token-exchange step.</p>"; }
else if (err) { out.innerHTML = "<p>Error: <code>" + err.replace(/[<>&]/g, "") + "</code> &mdash; " + (p.get("error_description") || "").replace(/[<>&]/g, "") + "</p>"; }
</script>
</body></html>
